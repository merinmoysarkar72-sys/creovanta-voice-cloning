name: Validate Creovanta

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Verify API routes import
        working-directory: backend
        run: python -c "from app.main import app; paths = {r.path for r in app.routes}; assert '/api/v1/speech/tts' in paths and '/api/v1/speech/voices/status' in paths; print('Creovanta speech API routes registered')"
