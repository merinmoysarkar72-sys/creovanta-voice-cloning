name: Deploy Creovanta GPU Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "gpu-worker/**"
      - ".github/workflows/deploy-gpu-worker.yml"

permissions:
  contents: read

concurrency:
  group: creovanta-gpu-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      CREOVANTA_WORKER_TOKEN: ${{ secrets.CREOVANTA_WORKER_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo "Missing MODAL_TOKEN_ID repository secret"; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo "Missing MODAL_TOKEN_SECRET repository secret"; exit 1; }
          test -n "$CREOVANTA_WORKER_TOKEN" || { echo "Missing CREOVANTA_WORKER_TOKEN repository secret"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "Missing SUPABASE_URL repository secret"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install worker dependencies
        run: python -m pip install -r gpu-worker/requirements.txt

      - name: Create or update Modal worker secret
        shell: bash
        run: |
          modal secret create --force creovanta-worker "CREOVANTA_WORKER_TOKEN=$CREOVANTA_WORKER_TOKEN" "SUPABASE_URL=$SUPABASE_URL"

      - name: Deploy GPU worker
        run: modal deploy gpu-worker/modal_app.py
